<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — Tietjen Enterprise</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --ink: #08070a;
            --bone: #f3eedf;
            --bone-mute: #b6b0a0;
            --bone-dim: #7a7568;
            --gold: #c9a961;
            --gold-bright: #e6c87f;
            --line: rgba(255, 248, 220, 0.16);
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            background: var(--ink);
            color: var(--bone);
            font-family: 'Inter', -apple-system, sans-serif;
            font-weight: 300;
            text-align: center;
        }
        .code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 28px;
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.4rem, 7vw, 4.2rem);
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: -0.018em;
            margin-bottom: 24px;
        }
        h1 em { font-style: italic; color: var(--gold); font-weight: 300; }
        p {
            color: var(--bone-mute);
            font-size: 1.05rem;
            line-height: 1.7;
            max-width: 44ch;
            margin: 0 auto 40px;
        }
        a {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 28px;
            background: var(--gold);
            color: var(--ink);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            border-radius: 2px;
            transition: background 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        a:hover { background: var(--gold-bright); }
        .rule { width: 90px; height: 1px; background: var(--line); margin: 48px auto 0; }
        .sig {
            margin-top: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.66rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--bone-dim);
        }
    </style>
</head>
<body>
    <main>
        <div class="code">Error 404</div>
        <h1>This one has <em>no origin story</em>.</h1>
        <p>The page you were after isn't here. Everything worth seeing is back on the main site.</p>
        <a href="/">Return home</a>
        <div class="rule"></div>
        <div class="sig">Tietjen Enterprise</div>
    </main>
</body>
</html>
